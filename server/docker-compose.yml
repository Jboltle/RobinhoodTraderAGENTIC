name: rh-discord-trader

# Bring the stack up with:
#
#   docker compose --env-file ../.env up --build
#
# The flag is not optional. env_file below only injects variables into running
# containers; the client's Supabase keys are Docker BUILD args, and those come
# from compose's own interpolation, which does not read ../.env on its own.

services:
  # Trader + Discord bot in one container, same as production (see
  # Dockerfile.server and ../render.yaml). All state lives in Supabase, so
  # nothing is mounted -- the container is disposable.
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    env_file: ../.env
    environment:
      # Inside compose, "localhost" points at the container itself. Default to
      # the ollama service DNS name; override in .env for host Ollama
      # (http://host.docker.internal:11434) or a cloud provider.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      # Both listeners must bind all interfaces inside the container so the
      # published ports work regardless of the host-oriented (127.0.0.1) .env
      # values.
      TRADER_HOST: 0.0.0.0
      ROBINHOOD_OAUTH_CALLBACK_HOST: 0.0.0.0
      # The bot now shares the container with the trader, so the webhook never
      # leaves loopback. Pinned here because .env is host-oriented.
      TRADER_WEBHOOK_URL: http://127.0.0.1:${TRADER_PORT:-3000}/webhook/discord
    # SUPABASE_URL is deliberately NOT overridden here -- listing it would
    # clobber the env_file value. With a HOSTED project nothing is needed. With
    # a local Supabase (`npx supabase start`, listening on the host) set
    # SUPABASE_URL=http://host.docker.internal:54331 in ../.env before bringing
    # compose up; the browser still needs 127.0.0.1, which is why the client's
    # build arg below keeps its own value.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Identity mappings (host port == container port) keep the OAuth redirect
    # URI derived from .env valid both inside the container and in the browser.
    # Published on host loopback only: mirrors the non-Docker default.
    ports:
      - "127.0.0.1:${TRADER_PORT:-3000}:${TRADER_PORT:-3000}"
      # Robinhood OAuth browser callback -- must be reachable from the host
      # browser during first-run auth.
      - "127.0.0.1:${ROBINHOOD_OAUTH_CALLBACK_PORT:-8788}:${ROBINHOOD_OAUTH_CALLBACK_PORT:-8788}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch(`http://localhost:$${process.env.TRADER_PORT||3000}/health`).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      # The trader binds its port before doing any Robinhood work, so this no
      # longer has to wait out a first-run OAuth flow.
      retries: 6
      start_period: 30s

  client:
    build:
      # Repo root: Dockerfile.client COPYs client/... relative to the root.
      context: ..
      dockerfile: Dockerfile.client
      args:
        # Baked into the bundle at build time; the BROWSER calls these, so they
        # must be host-reachable (the server's published loopback port), NOT
        # the compose-internal "http://server:3000".
        API_URL: ${API_URL:-http://localhost:${TRADER_PORT:-3000}}
        SUPABASE_URL: ${SUPABASE_URL:-http://127.0.0.1:54331}
        SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy

  # Optional local LLM. Opt in with: docker compose --profile ollama up
  # Then pull a model once: docker compose exec ollama ollama pull qwen3:8b
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    # GPU acceleration (NVIDIA): requires nvidia-container-toolkit on the host.
    # Uncomment to enable; without it Ollama falls back to CPU.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  ollama-models:
