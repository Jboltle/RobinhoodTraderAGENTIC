[project]
name = "listener"
version = "0.1.0"
description = "Discord gateway Listener: captures watched-channel messages into the messages table"
requires-python = ">=3.13"
dependencies = [
    "discord.py-self",
    "asyncpg>=0.30",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[tool.uv.sources]
# Pinned to a specific commit on main rather than the PyPI release. main tracks
# the current Discord client fingerprint (IDENTIFY, super-properties,
# heartbeat), which is the main detection surface for a user-token client, and
# releases lag it by months. Bump this SHA to take upstream updates.
"discord.py-self" = { git = "https://github.com/dolfies/discord.py-self.git", rev = "2ba64a9a997e151a9c259984e0a179b1fdf4aff4" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/listener"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # hardcoded fake tokens in fixtures

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
